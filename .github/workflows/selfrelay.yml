name: selfrelay

on:
  pull_request:
    branches: ["feature/**"]
  workflow_run:
    workflows: [selfrelay]
    types: [completed]

permissions: {}

jobs:
  show:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: show the event
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          PULL: ${{ github.event.workflow_run.pull_requests[0].number }}
          HEAD: ${{ github.event.workflow_run.head_sha }}
        run: echo "event=$EVENT ref=$REF run_event=$RUN_EVENT pull=$PULL head=$HEAD"
